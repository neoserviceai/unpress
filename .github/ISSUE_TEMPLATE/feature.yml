name: Idea
description: Something Unpress should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. What you want to build, and where
        Unpress gets in the way.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today
      description: Workaround, another tool, or not at all.
  - type: checkboxes
    id: plugin
    attributes:
      label: Could this be a plugin?
      description: >
        Capabilities usually belong in a plugin — it survives updates and the
        site owner can switch it off. See docs/PLUGIN-TUTORIAL.md.
      options:
        - label: I have read the plugin tutorial and this needs to be in the engine
