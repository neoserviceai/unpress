name: Build engine image

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "docker/single/**"
      - "scripts/build-image.sh"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

env:
  # The Builder the Studio ships: our own fork of frappe/builder, carrying
  # `unpress` (the product) and `develop` (upstream, for syncing).
  #
  # It used to be one repository holding two products on two branches. They
  # were split in 2026-08 because a shared repository meant the open-source
  # project and a separate commercial product could not move independently —
  # and the guard below existed only to catch the confusion. It stays: a v15
  # Builder on a frappe 16 bench installs fine and then fails at runtime in
  # ways that look like data problems.
  BUILDER_REPO: neoserviceai/builder
  BUILDER_REF: unpress

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The build cache stays on the runner while the suite pulls the image it
      # just pushed, so the image sits on this disk twice. On 2026-11-01 that
      # ran out of room in the middle of the pull, on one run out of three with
      # the same image size. Nothing here uses these preinstalled toolchains.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@v4

      # No token: the fork is public. It used to be a private checkout, which
      # meant the build depended on a personal access token that nobody outside
      # the org could reproduce — and that a stranger reading this file could
      # not tell was the reason their build failed.
      - name: Checkout the Builder fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BUILDER_REPO }}
          ref: ${{ env.BUILDER_REF }}
          path: vendor/builder

      - name: Refuse a frappe/builder mismatch
        run: |
          # A v15 Builder on a frappe 16 bench installs and then fails at
          # runtime in ways that look like data problems. Fail loudly instead.
          grep -q "frappe-branch version-16" docker/single/Dockerfile || {
            echo "::error::Dockerfile no longer targets frappe version-16"; exit 1; }
          if git -C vendor/builder log -1 --format=%D | grep -q "version-15"; then
            echo "::error::builder checkout is on version-15; the Studio is v16 only"; exit 1
          fi

      - name: Stage build context
        run: |
          mkdir -p stage/ctx stage/docker/single
          rsync -a --exclude node_modules --exclude .git vendor/builder/ stage/ctx/builder/
          rsync -a apps/wp_migrator/ stage/ctx/wp_migrator/
          rsync -a apps/unpress_core/ stage/ctx/unpress_core/
          cp docker/single/Dockerfile stage/Dockerfile
          cp docker/single/Procfile.prod stage/docker/single/Procfile.prod
          cp docker/single/entrypoint.sh stage/docker/single/entrypoint.sh

      # arm64 is emulated on the amd64 runner. Measured end to end on
      # 2026-08-11: 42 minutes for the whole job — build, boot, suite, and both
      # architectures published. Slow, but it sits AFTER the test gate, so it
      # never delays finding out something is broken. Move to a two-runner
      # matrix with a manifest merge if that number grows.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        # Follows whichever org owns the repo, so moving it to neoservice
        # renames the package without touching this file.
        run: echo "ref=ghcr.io/${{ github.repository_owner }}/unpress" >> "$GITHUB_OUTPUT"

      # Build the runner's own architecture first, so the suite runs against
      # the very thing we are about to publish. Publishing first and testing
      # after is how a broken image reaches people.
      #
      # Pushed under a throwaway tag rather than loaded into the local daemon:
      # `load: true` writes a tarball and imports it, which needs the image
      # twice over on a runner that does not have room for it once. A
      # `ci-<sha>` tag is nobody's `latest`.
      - name: Build for testing (amd64)
        uses: docker/build-push-action@v6
        with:
          context: stage
          push: true
          tags: ${{ steps.image.outputs.ref }}:ci-${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache

      - name: Boot the stack and run the suite
        env:
          UNPRESS_IMAGE: ${{ steps.image.outputs.ref }}:ci-${{ github.sha }}
          UNPRESS_SITE: ci.localhost
          UNPRESS_ADMIN_PASSWORD: ci-only-throwaway
          UNPRESS_DB_ROOT_PASSWORD: ci-only-throwaway
        run: |
          set -euo pipefail
          docker compose -f docker/single/compose.yaml up -d
          # First boot creates the site; it is minutes, not seconds.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -H "Host: $UNPRESS_SITE" http://localhost:8080/ 2>/dev/null; then
              echo "site up after ~$((i*10))s"; break
            fi
            sleep 10
            [ "$i" = "60" ] && { echo "::error::site never came up"; docker compose -f docker/single/compose.yaml logs --tail=80 unpress; exit 1; }
          done
          docker compose -f docker/single/compose.yaml exec -T unpress \
            bench --site "$UNPRESS_SITE" set-config allow_tests true
          docker compose -f docker/single/compose.yaml exec -T unpress \
            bench --site "$UNPRESS_SITE" run-tests --app unpress_core

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker/single/compose.yaml logs --tail=120

      - name: Free the runner's disk before the multi-arch build
        run: |
          docker compose -f docker/single/compose.yaml down -v || true
          docker image prune -af || true
          df -h / | tail -1

      # Only the public repository publishes. The working repository runs the
      # same build and the same suite — that is the gate that matters during
      # development — but the image people pull must correspond to the tree
      # they can read. Two repositories pushing the same tag is a race whose
      # winner is whoever finished last.
      - name: Publish (multi-arch)
        if: github.repository == 'neoserviceai/unpress'
        uses: docker/build-push-action@v6
        with:
          context: stage
          push: true
          # Without this the action builds for the runner's architecture only,
          # and the runner is amd64 — so `curl | bash` handed every Apple
          # Silicon laptop an emulated image. The arm64 that was on `:latest`
          # until 2026-07-29 came from a local build pushed by hand, and every
          # CI run since has quietly replaced it.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.ref }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache,mode=max
