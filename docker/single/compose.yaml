# Unpress single-site deployment.
#
#   UNPRESS_SITE=mysite.com UNPRESS_DOMAIN=mysite.com docker compose up -d
#
# With UNPRESS_DOMAIN set and ports 80/443 reachable, the bundled Caddy
# obtains TLS automatically. Without it, Unpress listens on :8080.
services:
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${UNPRESS_DB_ROOT_PASSWORD:-unpress}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${UNPRESS_DB_ROOT_PASSWORD:-unpress}"]
      interval: 5s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped

  unpress:
    image: ${UNPRESS_IMAGE:-ghcr.io/neoserviceai/unpress:latest}
    restart: unless-stopped
    environment:
      UNPRESS_SITE: ${UNPRESS_SITE:-unpress.localhost}
      UNPRESS_ADMIN_PASSWORD: ${UNPRESS_ADMIN_PASSWORD:-}
      UNPRESS_DB_ROOT_PASSWORD: ${UNPRESS_DB_ROOT_PASSWORD:-unpress}
      UNPRESS_DB_HOST: mariadb
      UNPRESS_REDIS_HOST: redis
      # The public address, which the container cannot infer: it only ever
      # sees plain http on its own port 8000. The entrypoint turns these into
      # the site's `host_name`.
      UNPRESS_DOMAIN: ${UNPRESS_DOMAIN:-}
      UNPRESS_HTTP_PORT: ${UNPRESS_HTTP_PORT:-8080}
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
    ports:
      - "${UNPRESS_HTTP_PORT:-8080}:8000"
    depends_on:
      mariadb:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      UNPRESS_DOMAIN: ${UNPRESS_DOMAIN:-}
    # Serves the apex and redirects www to it. People point both records at the
    # server; a Caddyfile naming only one leaves the other with no certificate,
    # so it does not fail over — it fails to answer at all.
    command:
      - sh
      - -c
      - |
        [ -n "$$UNPRESS_DOMAIN" ] || { echo "set UNPRESS_DOMAIN in .env to use the tls profile"; exit 1; }
        APEX="$${UNPRESS_DOMAIN#www.}"
        cat > /tmp/Caddyfile <<EOF
        $$APEX {
        	reverse_proxy unpress:8000
        }

        www.$$APEX {
        	redir https://$$APEX{uri} permanent
        }
        EOF
        caddy validate --config /tmp/Caddyfile --adapter caddyfile || exit 1
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

volumes:
  mariadb-data:
  sites-data:
  caddy-data:
